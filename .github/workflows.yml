name : Hola-mundo
on: [push]

jobs:
  primer-job:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el código
      uses: actions/checkout@v4 

    - name: Configurar python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Ejecutar código
      run: python ejemplo.py